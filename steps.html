<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steps">
<meta name="theme-color" content="#6b8f71">
<title>Step Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #f5f8f5;
    --surface: #ffffff;
    --surface2: #edf2ed;
    --text: #1a1f1a;
    --text-muted: #7a8f7a;
    --green: #6b8f71;
    --green-light: #e8f0e9;
    --green-dark: #4a6b50;
    --border: #dde8dd;
    --shadow: rgba(26,40,26,0.07);
    --radius: 18px;
    --red: #c0544a;
    --red-light: #fdecea;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--green-dark);
    color: #fff;
    padding: 22px 28px 20px;
    padding-top: max(22px, env(safe-area-inset-top));
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; letter-spacing: -0.3px;
  }
  .header-sub {
    font-size: 13px; color: rgba(255,255,255,0.55);
    margin-top: 3px; font-weight: 500;
  }

  /* MAIN */
  .main {
    padding: 20px 18px 40px;
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }

  /* WEEKLY SUMMARY */
  .summary-card {
    background: var(--green-dark);
    border-radius: var(--radius);
    padding: 20px 22px;
    color: white;
    display: flex; justify-content: space-between; align-items: center;
  }
  .summary-label { font-size: 12px; font-weight: 600; opacity: 0.6; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .summary-value { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1; }
  .summary-sub { font-size: 12px; opacity: 0.65; margin-top: 4px; }
  .summary-divider { width: 1px; height: 50px; background: rgba(255,255,255,0.15); }
  .goal-ring { position: relative; width: 64px; height: 64px; }
  .goal-ring svg { display: block; }
  .goal-ring .ring-pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white;
  }

  /* LOG ENTRY */
  .log-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px var(--shadow);
    overflow: hidden;
  }
  .log-card-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .log-card-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px; color: var(--text);
  }
  .today-badge {
    font-size: 12px; font-weight: 600;
    background: var(--green-light); color: var(--green);
    padding: 4px 10px; border-radius: 20px; letter-spacing: 0.04em;
  }

  .step-input-wrap {
    padding: 20px;
    display: flex; gap: 12px; align-items: center;
  }
  .step-input {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 28px; font-weight: 600;
    color: var(--text);
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s;
    text-align: center;
  }
  .step-input:focus { border-color: var(--green); }
  .step-input::placeholder { color: var(--border); font-size: 22px; }

  .save-btn {
    background: var(--green);
    color: white; border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 600;
    padding: 14px 22px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .save-btn:active { background: var(--green-dark); transform: scale(0.97); }

  .today-saved {
    padding: 0 20px 20px;
    display: none;
  }
  .today-saved.visible { display: flex; align-items: center; gap: 10px; }
  .today-saved-count {
    font-family: 'DM Serif Display', serif;
    font-size: 32px; color: var(--text);
  }
  .today-saved-meta { flex: 1; }
  .today-saved-label { font-size: 13px; color: var(--text-muted); }
  .today-goal-pill {
    font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px; letter-spacing: 0.04em;
  }
  .goal-met   { background: var(--green-light); color: var(--green); }
  .goal-unmet { background: var(--red-light); color: var(--red); }

  .edit-link {
    font-size: 13px; color: var(--green); font-weight: 600;
    cursor: pointer; text-decoration: underline;
    background: none; border: none; padding: 0;
    font-family: 'DM Sans', sans-serif;
  }

  /* HISTORY */
  .history-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px var(--shadow);
    overflow: hidden;
  }
  .history-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    font-family: 'DM Serif Display', serif;
    font-size: 18px; color: var(--text);
  }

  .history-row {
    display: flex; align-items: center;
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    gap: 14px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .dot-met   { background: var(--green); }
  .dot-unmet { background: var(--red); }
  .dot-empty { background: var(--border); }
  .history-date { font-size: 14px; color: var(--text-muted); width: 90px; flex-shrink: 0; }
  .history-steps { font-size: 17px; font-weight: 600; flex: 1; }
  .history-steps.empty { color: var(--text-muted); font-weight: 400; font-size: 14px; }
  .history-badge {
    font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px; letter-spacing: 0.04em;
  }
  .hb-met   { background: var(--green-light); color: var(--green); }
  .hb-unmet { background: var(--red-light); color: var(--red); }

  .empty-history {
    padding: 30px 20px; text-align: center;
    color: var(--text-muted); font-size: 14px; line-height: 1.6;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Step Tracker</div>
  <div class="header-sub" id="headerDate">—</div>
</div>

<div class="main">

  <!-- WEEKLY SUMMARY -->
  <div class="summary-card">
    <div>
      <div class="summary-label">Weekly Avg</div>
      <div class="summary-value" id="weeklyAvg">—</div>
      <div class="summary-sub" id="weeklyDays">No entries yet</div>
    </div>
    <div class="summary-divider"></div>
    <div>
      <div class="summary-label">Goal Days</div>
      <div class="summary-value" id="goalDays">0/7</div>
      <div class="summary-sub">7,000+ steps</div>
    </div>
    <div class="summary-divider"></div>
    <div class="goal-ring">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="5"/>
        <circle id="goalRingCircle" cx="32" cy="32" r="26" fill="none" stroke="#a8d4ae" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4"
          transform="rotate(-90 32 32)" style="transition: stroke-dashoffset 0.6s ease"/>
      </svg>
      <div class="ring-pct" id="goalRingPct">0%</div>
    </div>
  </div>

  <!-- TODAY'S ENTRY -->
  <div class="log-card">
    <div class="log-card-header">
      <div class="log-card-title">Today's Steps</div>
      <span class="today-badge" id="todayBadgeHeader">Log Now</span>
    </div>

    <div class="step-input-wrap" id="inputWrap">
      <input class="step-input" id="stepInput" type="number" inputmode="numeric"
        placeholder="0000" min="0" max="99999">
      <button class="save-btn" onclick="saveToday()">Save</button>
    </div>

    <div class="today-saved" id="todaySaved">
      <div class="today-saved-count" id="todayCount">—</div>
      <div class="today-saved-meta">
        <div class="today-saved-label">steps logged today</div>
        <button class="edit-link" onclick="editToday()">Edit</button>
      </div>
      <div class="today-goal-pill" id="todayGoalPill"></div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="history-card">
    <div class="history-header">Last 14 Days</div>
    <div id="historyList"><div class="empty-history">No steps logged yet.<br>Save today's count above to get started!</div></div>
  </div>

</div>

<script>
const GOAL      = 7000;
const STEPS_KEY = 'steps_log'; // { 'YYYY-MM-DD': number }

function getPSTDate() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
}

function loadLog() {
  try { return JSON.parse(localStorage.getItem(STEPS_KEY) || '{}'); } catch(e) { return {}; }
}
function saveLog(log) { localStorage.setItem(STEPS_KEY, JSON.stringify(log)); }

function formatDate(dateStr) {
  const [y, m, d] = dateStr.split('-');
  const date = new Date(+y, +m - 1, +d);
  const today = getPSTDate();
  const yesterday = new Date(Date.now() - 86400000).toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
  if (dateStr === today) return 'Today';
  if (dateStr === yesterday) return 'Yesterday';
  return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function formatSteps(n) {
  return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
}

function getLast14Days() {
  const days = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' }));
  }
  return days;
}

function getThisWeekDays() {
  // Last 7 days including today
  return getLast14Days().slice(0, 7);
}

function renderHeader() {
  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', weekday: 'long', month: 'long', day: 'numeric' });
}

function renderSummary(log) {
  const week = getThisWeekDays();
  const entries = week.map(d => log[d]).filter(v => v !== undefined);
  const goalDays = entries.filter(v => v >= GOAL).length;
  const avg = entries.length ? Math.round(entries.reduce((a, b) => a + b, 0) / entries.length) : null;

  document.getElementById('weeklyAvg').textContent = avg !== null ? formatSteps(avg) : '—';
  document.getElementById('weeklyDays').textContent = entries.length
    ? `${entries.length} day${entries.length !== 1 ? 's' : ''} logged`
    : 'No entries yet';
  document.getElementById('goalDays').textContent = `${goalDays}/7`;

  const pct = Math.round((goalDays / 7) * 100);
  const circ = 163.4;
  document.getElementById('goalRingCircle').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('goalRingPct').textContent = pct + '%';
}

function renderToday(log) {
  const today = getPSTDate();
  const val = log[today];
  const inputWrap  = document.getElementById('inputWrap');
  const todaySaved = document.getElementById('todaySaved');
  const badge      = document.getElementById('todayBadgeHeader');

  if (val !== undefined) {
    inputWrap.style.display = 'none';
    todaySaved.classList.add('visible');
    document.getElementById('todayCount').textContent = val.toLocaleString();
    const met = val >= GOAL;
    const pill = document.getElementById('todayGoalPill');
    pill.textContent = met ? '✓ Goal met!' : `${(GOAL - val).toLocaleString()} to go`;
    pill.className = 'today-goal-pill ' + (met ? 'goal-met' : 'goal-unmet');
    badge.textContent = met ? '✓ Goal Met' : 'Logged';
  } else {
    inputWrap.style.display = 'flex';
    todaySaved.classList.remove('visible');
    badge.textContent = 'Log Now';
  }
}

function renderHistory(log) {
  const days = getLast14Days();
  const list = document.getElementById('historyList');
  const hasAny = days.some(d => log[d] !== undefined);

  if (!hasAny) {
    list.innerHTML = '<div class="empty-history">No steps logged yet.<br>Save today\'s count above to get started!</div>';
    return;
  }

  list.innerHTML = days.map(d => {
    const val = log[d];
    if (val === undefined) {
      return `<div class="history-row">
        <div class="history-dot dot-empty"></div>
        <div class="history-date">${formatDate(d)}</div>
        <div class="history-steps empty">—</div>
      </div>`;
    }
    const met = val >= GOAL;
    return `<div class="history-row">
      <div class="history-dot ${met ? 'dot-met' : 'dot-unmet'}"></div>
      <div class="history-date">${formatDate(d)}</div>
      <div class="history-steps">${val.toLocaleString()}</div>
      <div class="history-badge ${met ? 'hb-met' : 'hb-unmet'}">${met ? '✓' : `−${(GOAL-val).toLocaleString()}`}</div>
    </div>`;
  }).join('');
}

function render() {
  const log = loadLog();
  renderHeader();
  renderSummary(log);
  renderToday(log);
  renderHistory(log);
}

function saveToday() {
  const raw = document.getElementById('stepInput').value.trim();
  const val = parseInt(raw);
  if (!raw || isNaN(val) || val < 0) {
    document.getElementById('stepInput').focus();
    return;
  }
  const log = loadLog();
  log[getPSTDate()] = val;
  saveLog(log);
  document.getElementById('stepInput').value = '';
  render();
}

function editToday() {
  const log = loadLog();
  const today = getPSTDate();
  const existing = log[today];
  document.getElementById('inputWrap').style.display = 'flex';
  document.getElementById('todaySaved').classList.remove('visible');
  if (existing !== undefined) {
    document.getElementById('stepInput').value = existing;
  }
  document.getElementById('stepInput').focus();
}

// Save on Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') saveToday();
});

render();
</script>
</body>
</html>
